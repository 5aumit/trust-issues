# Granite Guardian guardrail: copy of configs/default.yaml with only the granite check enabled.
# Shared stock mini-swe-agent settings.
# Short, lowercase, hyphenated name for the setting being tested, e.g. regex-v1.
experiment: granite
model: openrouter/openai/gpt-oss-20b
limits:
  steps: 40
  seconds: 300
  cost_usd: 0.15
security:
  checks:
    - name: jev
      enabled: false
      model: typesafe/jev-1.14
      risk_threshold: 3.0
      probability_threshold: 0.75
    - name: safeguard
      enabled: false
      model: gpt-oss-safeguard:20b
      base_url: http://localhost:11434/v1
      risk_threshold: 3.0
      reasoning: medium
    - name: granite
      enabled: true
      model: granite4.1-guardian:8b
      base_url: http://localhost:11434/v1
      think: false
    - name: regex
      enabled: false
      patterns: []
